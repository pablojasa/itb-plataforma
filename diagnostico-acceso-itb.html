<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de acceso · Academia TED</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d141c;color:#eef3f8;margin:0}main{max-width:780px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#b8c2cf}.card{background:#121b25;border:1px solid #2a3948;border-radius:14px;padding:18px;margin:18px 0}label{display:block;margin:12px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #405162;background:#0c1219;color:#fff}button{margin-top:16px;background:#fff;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070a0e;border:1px solid #29323d;border-radius:12px;padding:16px;min-height:180px}.small{font-size:13px;color:#94a3b8}</style></head><body><main><h1>Diagnóstico de acceso · Academia TED</h1><p>Prueba la conexión real del navegador con el backend y el login. No muestra ni registra el PIN.</p><div class="card"><label for="usuario">Usuario</label><input id="usuario" autocomplete="username"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><button id="run">Ejecutar diagnóstico</button><div class="small">Ejecutalo desde el mismo navegador donde falla la plataforma.</div></div><pre id="out">Listo para ejecutar.</pre></main><script>
const out=document.getElementById('out');const log=(...a)=>{out.textContent+='\n'+a.map(x=>typeof x==='string'?x:JSON.stringify(x,null,2)).join(' ')};const now=()=>new Date().toISOString();
function extractApi(text){const m=String(text||'').match(/window\.ITB_API_URL\s*=\s*["']([^"']+)["']/);return m?m[1]:''}
async function fetchText(url,cache='default'){const t=performance.now();try{const r=await fetch(url,{cache});const txt=await r.text();return{ok:r.ok,status:r.status,ms:Math.round(performance.now()-t),text:txt}}catch(e){return{ok:false,status:0,ms:Math.round(performance.now()-t),error:String(e?.message||e),text:''}}}
function jsonp(api,params,timeoutMs=45000,label='jsonp'){return new Promise(resolve=>{const t=performance.now(),cb='__itbDiagAccess'+Date.now()+Math.floor(Math.random()*100000),sc=document.createElement('script');let done=false;const errs=[];const onerr=ev=>{const src=String(ev.filename||'');if(src.includes('script.google')||src.includes('googleusercontent'))errs.push({message:String(ev.message||'Script error'),filename:src,lineno:ev.lineno||0,colno:ev.colno||0})};window.addEventListener('error',onerr);const cleanup=()=>{clearTimeout(timer);window.removeEventListener('error',onerr);try{delete window[cb]}catch(_){}try{sc.remove()}catch(_){}};const finish=obj=>{if(done)return;done=true;const ms=Math.round(performance.now()-t);cleanup();resolve(Object.assign({label,ms,script_errors:errs},obj))};window[cb]=data=>finish({ok:true,callback:true,response_ok:data&&data.ok!==false,response_error:String(data&&data.error||''),keys:Object.keys(data||{}),has_token:!!(data&&data.token),token_length:String(data&&data.token||'').length,has_user:!!(data&&data.user),role:String(data&&data.user&&data.user.rol||''),must_change_pin:!!(data&&data.must_change_pin)});sc.onerror=()=>finish({ok:false,callback:false,error:'script.onerror'});const qs=new URLSearchParams({...params,prefix:cb,ts:Date.now()});sc.src=api+(api.includes('?')?'&':'?')+qs.toString();sc.async=true;document.head.appendChild(sc);const timer=setTimeout(()=>finish({ok:false,callback:false,error:'timeout'}),timeoutMs)})}
async function cacheInfo(){const r={serviceWorkerSupported:'serviceWorker' in navigator,controlled:false,controller:'',caches:[]};try{if(navigator.serviceWorker){r.controlled=!!navigator.serviceWorker.controller;r.controller=navigator.serviceWorker.controller?.scriptURL||''}if('caches' in window)r.caches=await caches.keys()}catch(e){r.error=String(e?.message||e)}return r}
async function run(){out.textContent='Inicio: '+now();const usuario=document.getElementById('usuario').value.trim(),pin=document.getElementById('pin').value.trim();const result={started_at:now(),location:location.href};result.browser={userAgent:navigator.userAgent,online:navigator.onLine,visibility:document.visibilityState};log('NAVEGADOR',result.browser);result.client=await cacheInfo();log('SERVICE WORKER / CACHE',result.client);const a=await fetchText('./app-config.js','default'),b=await fetchText('./app-config.js?diag='+Date.now(),'no-store');result.config_normal={ok:a.ok,status:a.status,ms:a.ms,api_url:extractApi(a.text),error:a.error||''};result.config_bypass={ok:b.ok,status:b.status,ms:b.ms,api_url:extractApi(b.text),error:b.error||''};result.config_match=!!result.config_normal.api_url&&result.config_normal.api_url===result.config_bypass.api_url;log('APP-CONFIG NORMAL',result.config_normal);log('APP-CONFIG BYPASS',result.config_bypass);log('CONFIG COINCIDE:',result.config_match);const api=result.config_normal.api_url||result.config_bypass.api_url;if(!api){result.fatal='No se pudo obtener ITB_API_URL';log('FATAL',result.fatal);return}result.publicLanding=await jsonp(api,{action:'publicLanding'},30000,'publicLanding');log('PUBLIC LANDING',result.publicLanding);if(!usuario||!pin){result.login={skipped:true,reason:'Falta usuario o PIN'};log('LOGIN',result.login)}else{result.login=await jsonp(api,{action:'login',alumno_id:usuario,pin:pin},45000,'login');log('LOGIN',result.login)}result.finished_at=now();log('\n===== RESULTADO JSON =====\n'+JSON.stringify(result,null,2));log('\n===== FIN =====')}
document.getElementById('run').addEventListener('click',run);
</script></body></html>
